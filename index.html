<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Rutas</title>
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Rutas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: mapa a pantalla completa; barra lateral izquierda ocultable (☰) con una sección por tipo de sitio;
   botón flotante "+" para añadir; ficha en panel derecho (escritorio) o inferior (móvil). */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f3f6f4; --ink:#16201c; --muted:#5b6a63; --line:#d6ded9;
  --accent:#1d6b4d; --accent-ink:#ffffff; --danger:#b3261e; --star:#c98a00;
  --shadow:0 2px 12px rgba(16,32,26,.18);
  --tile-filter:none; --map-bg:#e3eae6; --grid:rgba(22,32,28,.09);
  --c-ruta:#2563eb; --c-pico:#d9482b; --c-dormida:#7c4dbd; --c-parking:#5b6b7b; --c-playa:#c27f06; --c-lago:#0c8f9d;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#161e1a; --surface-2:#1d2722; --ink:#e6eee9; --muted:#97a9a0; --line:#2a3731;
    --accent:#5ccb9b; --accent-ink:#06130d; --danger:#ff8a80; --star:#f0b429;
    --shadow:0 2px 14px rgba(0,0,0,.55);
    --tile-filter:invert(.92) hue-rotate(180deg) saturate(.75) brightness(.95); --map-bg:#1a2420; --grid:rgba(230,238,233,.09);
    --c-ruta:#6b97ff; --c-pico:#ff7a5c; --c-dormida:#b18cf0; --c-parking:#94a5b5; --c-playa:#f0b429; --c-lago:#3cc7d4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161e1a; --surface-2:#1d2722; --ink:#e6eee9; --muted:#97a9a0; --line:#2a3731;
  --accent:#5ccb9b; --accent-ink:#06130d; --danger:#ff8a80; --star:#f0b429;
  --shadow:0 2px 14px rgba(0,0,0,.55);
  --tile-filter:invert(.92) hue-rotate(180deg) saturate(.75) brightness(.95); --map-bg:#1a2420; --grid:rgba(230,238,233,.09);
  --c-ruta:#6b97ff; --c-pico:#ff7a5c; --c-dormida:#b18cf0; --c-parking:#94a5b5; --c-playa:#f0b429; --c-lago:#3cc7d4;
  color-scheme:dark;
}

/* Leaflet 1.9 (reglas esenciales, la hoja oficial no se puede cargar desde fuera) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:move}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-touch-drag{touch-action:none}
.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}

*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#app{position:relative;display:flex;height:100%;overflow:hidden}
.stage{position:relative;flex:1;min-width:0;height:100%}
#map{position:absolute;inset:0;z-index:0;background-color:var(--map-bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;font-family:var(--f-body)}
#map.map-std .leaflet-tile-pane{filter:var(--tile-filter)}

/* Barra lateral */
.side{position:absolute;inset:0 auto 0 0;width:min(86vw,330px);transform:translateX(-102%);transition:transform .25s ease;z-index:1200;
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.app-side-open .side{transform:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:1100;opacity:0;pointer-events:none;transition:opacity .25s}
.app-side-open .scrim{opacity:1;pointer-events:auto}
@media (min-width:820px){
  .side{position:relative;transform:none;margin-left:-330px;width:330px;flex:none;transition:margin-left .25s ease}
  .app-side-open .side{margin-left:0}
  .scrim{display:none}
}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.side-scroll{flex:1;overflow:auto;padding:0 12px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 4px 14px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.all-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;border:0;background:transparent;font-weight:600;text-align:left}
.all-btn:hover{background:var(--surface-2)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);margin-top:4px}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 8px;cursor:pointer;border-radius:12px;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--surface-2)}
.chip{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.sec-name{flex:1;font-weight:600;min-width:0}
.sec-name.off,.sec.off .count{opacity:.45}
.eye{width:34px;height:34px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.eye:hover{background:var(--line)}
.eye[aria-pressed="true"]{color:var(--ink)}
.caret{transition:transform .15s;color:var(--muted)}
.sec[open] .caret{transform:rotate(90deg)}
.sites{list-style:none;margin:0 0 8px;padding:0 0 0 12px;display:flex;flex-direction:column;gap:2px}
.site-item{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;display:block;min-width:0}
.site-item:hover{background:var(--surface-2)}
.site-item.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--c)}
.site-name{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0}
.site-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:1px 5px;flex:none}
.empty{font-size:13px;color:var(--muted);padding:4px 10px 8px}
.side-foot{border-top:1px solid var(--line);padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}

/* Controles sobre el mapa */
.topbar{position:absolute;z-index:500;top:12px;left:0;right:0;display:flex;align-items:center;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar>*{pointer-events:auto}
.menu-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.title-pill{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:baseline;gap:10px;padding:0 14px;min-width:0;align-self:center}
.title-pill{align-items:center}
.title-pill h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.title-pill .count{white-space:nowrap}
.mapctl{position:absolute;z-index:500;left:max(16px,env(safe-area-inset-left,0px));bottom:26px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.mapctl button:hover{background:var(--surface-2)}
.fab{position:absolute;z-index:500;right:max(16px,env(safe-area-inset-right,0px));bottom:28px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 4px 16px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:600;font-size:16px}
.fab:hover{filter:brightness(1.07)}
.attrib{position:absolute;z-index:400;right:6px;bottom:3px;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 82%,transparent);padding:1px 6px;border-radius:6px}
.attrib a{color:inherit}
.toast{position:absolute;z-index:900;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(92%,440px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);text-align:center}

/* Marcadores */
.pin-wrap{background:none;border:0}
.pin{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.pin.sel{transform:scale(1.18);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent),0 2px 8px rgba(0,0,0,.4)}
.pin.new{border-style:dashed;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent),0 2px 8px rgba(0,0,0,.4)}
path.trk{fill:none;stroke-linecap:round;stroke-linejoin:round}
path.trk-case{stroke:#fff;stroke-opacity:.85}
path.trk-ruta{stroke:var(--c-ruta)} path.trk-pico{stroke:var(--c-pico)} path.trk-dormida{stroke:var(--c-dormida)}
path.trk-parking{stroke:var(--c-parking)} path.trk-playa{stroke:var(--c-playa)} path.trk-lago{stroke:var(--c-lago)}
path.me-dot{fill:var(--c-ruta);stroke:#fff}
path.me-acc{fill:var(--c-ruta);stroke:var(--c-ruta)}

/* Ficha */
.sheet{position:absolute;z-index:700;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;
  left:0;right:0;bottom:0;max-height:64%;border-radius:20px 20px 0 0;border-top:1px solid var(--line)}
@media (min-width:820px){
  .sheet{left:auto;right:16px;top:72px;bottom:16px;width:390px;max-height:none;border-radius:16px;border:1px solid var(--line)}
}
@media (max-width:819px){
  .sheet-open .fab,.sheet-open .mapctl,.sheet-open .attrib,.sheet-open .toast{display:none}
}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-head .kind{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--c,var(--muted))}
.sheet-body{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:14px}
.stars{color:var(--star);letter-spacing:2px;font-size:16px}
.stars .off{opacity:.3}
.comment{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:62ch}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--surface-2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.trackbox{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.tgrid b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.tgrid span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.profile{width:100%;height:84px;display:block;color:var(--c)}
.pin.grp{--c:#2b3a35;font-family:var(--f-display);font-weight:700;font-size:15px}
.pin.grp.big{width:40px;height:40px}
.chartbox{display:flex;flex-direction:column;gap:4px}
.chart-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chart-head .ro{font-family:var(--f-mono);text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px;white-space:nowrap}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y;color:var(--c);cursor:crosshair}
.coords{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coords code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:4px 8px;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}

/* Formulario */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
textarea.input{resize:vertical;min-height:84px}
.input.bad{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink)}
.type-btn .chip{width:28px;height:28px}
.type-btn[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));font-weight:600}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:28px;line-height:1;padding:2px 3px;color:var(--star)}
.rate button.off{opacity:.3}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;padding:0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lightbox{position:absolute;inset:0;z-index:1500;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.people{display:flex;flex-direction:column;gap:2px;margin:0 4px 10px}
.person{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 8px;border-radius:10px;min-width:0}
.person .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.person.off .nm{opacity:.45}
.share-list{display:flex;flex-direction:column;gap:6px}
.share-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 8px 6px 10px;min-width:0}
.share-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.modal .card{max-height:100%;overflow:auto}
.side-foot{max-height:46%;overflow:auto}
.acct{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.acct-row{display:flex;flex-direction:column;gap:2px;min-width:0}
.acct-mail{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:absolute;inset:0;z-index:2100;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.card{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card form{display:flex;flex-direction:column;gap:12px}
.card-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.brandwrap svg{display:block;flex:none;border-radius:10px}
.title-pill{min-width:0;flex:0 1 auto}
.title-pill h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.title-pill .count{display:none}}

<body>
<div id="app" class="app-side-open">
  <aside class="side" id="side" aria-label="Secciones">

      <div class="brandwrap"><span id="miniLogo" aria-hidden="true"></span><div class="brand">Mis Rutas<small>Diario de sitios visitados</small></div></div>

      <nav id="sections" aria-label="Tipos de sitio"></nav>
      <button class="btn sm add-cat" id="addCatBtn" type="button"></button>
    </div>
    <div class="side-foot">
      <button class="btn" id="importTrack" type="button"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage" id="stage">
    <div id="map" aria-label="Mapa"></div>
    <header class="topbar">

      <div class="title-pill"><h1 id="topTitle">Mis Rutas</h1><span class="count" id="topCount"></span></div>
      <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Mi perfil"></button>
    </header>
    <div class="mapctl" id="mapctl">
      <button type="button" id="zin" aria-label="Acercar"></button>
      <button type="button" id="zout" aria-label="Alejar"></button>
      <button type="button" id="fitAll" aria-label="Ver todos los sitios"></button>
      <button type="button" id="locBtn" aria-label="Ir a mi ubicación"></button>
      <button type="button" id="layersBtn" aria-label="Tipo de mapa" aria-haspopup="true" aria-expanded="false"></button>
    </div>
    <div class="base-menu" id="baseMenu" role="menu" aria-label="Tipo de mapa" hidden></div>
    <button class="fab" id="fab" type="button"></button>
    <div class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
    <section class="sheet" id="sheet" hidden aria-live="polite"></section>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="lightbox" id="lightbox" hidden></div>
    <div class="modal" id="authBox" hidden></div>
  </main>
  <div class="gate" id="gate">
    <svg class="gate-bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">

      </g>
      <g transform="translate(90 80)">
        <ellipse rx="220" ry="125" transform="rotate(-20)"/><ellipse rx="166" ry="90" transform="rotate(-12) translate(6 4)"/><ellipse rx="112" ry="58" transform="rotate(-4) translate(8 6)"/><ellipse rx="58" ry="28" transform="rotate(4) translate(8 6)"/>
      </g>
    </svg>
    <div class="gate-card" id="gateCard"></div>
  </div>
</div>

function parseCoords(s){
  s=String(s||'').trim();var a;
  if(s.indexOf(';')>-1)a=s.split(';').map(function(x){return parseFloat(x.replace(',','.'));});
  else a=(s.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
  if(a.length>=2&&isFinite(a[0])&&isFinite(a[1])&&Math.abs(a[0])<=90&&Math.abs(a[1])<=180)return [a[0],a[1]];
  return null;
}

/* ---------- Rutas: lectura de GPX y TCX ---------- */
function haversine(a,b){
  var R=6371000,rad=Math.PI/180,dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function parseTrack(text,fileName){
  var doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('El archivo no es un GPX o TCX válido.');
  var raw=[],nodes=doc.getElementsByTagName('trkpt');
  if(!nodes.length)nodes=doc.getElementsByTagName('rtept');
  var i,n,t,e,tm;
  if(nodes.length){
    for(i=0;i<nodes.length;i++){n=nodes[i];
      e=n.getElementsByTagName('ele')[0];tm=n.getElementsByTagName('time')[0];
      raw.push({lat:parseFloat(n.getAttribute('lat')),lon:parseFloat(n.getAttribute('lon')),ele:e?parseFloat(e.textContent):NaN,t:tm?Date.parse(tm.textContent):NaN});}
  }else{
    nodes=doc.getElementsByTagName('Trackpoint');
    for(i=0;i<nodes.length;i++){n=nodes[i];
      var la=n.getElementsByTagName('LatitudeDegrees')[0],lo=n.getElementsByTagName('LongitudeDegrees')[0];
      if(!la||!lo)continue;
      e=n.getElementsByTagName('AltitudeMeters')[0];tm=n.getElementsByTagName('Time')[0];
      raw.push({lat:parseFloat(la.textContent),lon:parseFloat(lo.textContent),ele:e?parseFloat(e.textContent):NaN,t:tm?Date.parse(tm.textContent):NaN});}
  }
  raw=raw.filter(function(p){return isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180;});
  if(raw.length<2)throw new Error('No se han encontrado puntos de ruta en el archivo.');
  var dist=0,gain=0,loss=0,ref=null,minE=Infinity,maxE=-Infinity,cum=[0];
  for(i=0;i<raw.length;i++){
    if(i>0){dist+=haversine([raw[i-1].lat,raw[i-1].lon],[raw[i].lat,raw[i].lon]);cum.push(dist);}
    var el=raw[i].ele;
    if(isFinite(el)){
      if(ref===null)ref=el;
      if(el-ref>=3){gain+=el-ref;ref=el;}else if(ref-el>=3){loss+=ref-el;ref=el;}
      if(el<minE)minE=el;if(el>maxE)maxE=el;
    }
  }
  var t0=raw[0].t,t1=raw[raw.length-1].t;
  var step=Math.ceil(raw.length/1500),pts=[];
  for(i=0;i<raw.length;i+=step){var p=raw[i];pts.push([+p.lat.toFixed(5),+p.lon.toFixed(5),isFinite(p.ele)?Math.round(p.ele):null,Math.round(cum[i]),(isFinite(p.t)&&isFinite(t0))?Math.round((p.t-t0)/1000):null]);}
  var last=raw[raw.length-1];
  if(pts[pts.length-1][3]!==Math.round(dist))pts.push([+last.lat.toFixed(5),+last.lon.toFixed(5),isFinite(last.ele)?Math.round(last.ele):null,Math.round(dist),(isFinite(last.t)&&isFinite(t0))?Math.round((last.t-t0)/1000):null]);
  var nm=doc.getElementsByTagName('name')[0];
  var name=(nm&&nm.textContent.trim())||String(fileName||'').replace(/\.[^.]+$/,'');
  return {name:name,date:isFinite(t0)?new Date(t0).toISOString().slice(0,10):'',
    track:{pts:pts,dist:Math.round(dist),gain:Math.round(gain),loss:Math.round(loss),
      dur:(isFinite(t0)&&isFinite(t1)&&t1>t0)?Math.round((t1-t0)/1000):0,
      minE:isFinite(minE)?Math.round(minE):null,maxE:isFinite(maxE)?Math.round(maxE):null}};
}
function readFileText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error('No se pudo leer el archivo.'));};r.readAsText(f);});}
function loadTrackFile(f){
  if(/\.fit$/i.test(f.name))return Promise.reject(new Error('Los archivos .fit aún no se leen. Exporta la actividad como GPX desde Garmin Connect o la app de Suunto.'));
  return readFileText(f).then(function(t){return parseTrack(t,f.name);});
}
function readImage(file){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();
    img.onload=function(){var m=900,k=Math.min(1,m/Math.max(img.width,img.height)),w=Math.round(img.width*k),hh=Math.round(img.height*k);
      var c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);res(c.toDataURL('image/jpeg',.72));};
    img.onerror=function(){rej(new Error('No se pudo abrir la foto.'));};img.src=fr.result;};
  fr.onerror=function(){rej(new Error('No se pudo leer la foto.'));};fr.readAsDataURL(file);
});}

var fanKey=null,scrubLayer=L.layerGroup().addTo(map);
function renderMap(){
  trackLayer.clearLayers();pinLayer.clearLayers();scrubLayer.clearLayers();
  var z=map.getZoom(),groups=[];
  visibleSites().forEach(function(s){
    if(s.track&&s.track.pts&&s.track.pts.length>1){
      var ll=s.track.pts.map(function(p){return [p[0],p[1]];});
      L.polyline(ll,{className:'trk trk-case',weight:7,interactive:false}).addTo(trackLayer);
      L.polyline(ll,Object.assign({className:'trk trk-'+s.type,weight:4,opacity:.95},(TMAP[s.type]&&TMAP[s.type].color)?{color:TMAP[s.type].color}:{})).on('click',function(){select(s.id);}).addTo(trackLayer);
    }
    var pt=map.project([s.lat,s.lon],z),g=null,i;
    for(i=0;i<groups.length;i++){if(Math.abs(groups[i].c.x-pt.x)<38&&Math.abs(groups[i].c.y-pt.y)<38){g=groups[i];break;}}
    if(!g){g={c:{x:pt.x,y:pt.y},m:[]};groups.push(g);}
    g.m.push(s);g.c.x+=(pt.x-g.c.x)/g.m.length;g.c.y+=(pt.y-g.c.y)/g.m.length;
  });
  groups.forEach(function(g){
    if(g.m.length===1){addPin(g.m[0],[g.m[0].lat,g.m[0].lon]);return;}
    var key=g.m.map(function(s){return s.id;}).sort().join('|');
    var fanned=key===fanKey||g.m.some(function(s){return s.id===selectedId;});
    var cl=map.unproject(g.c,z);
    if(!fanned){
      var gm=L.marker(cl,{icon:L.divIcon({className:'pin-wrap',html:'<div class="pin grp">'+g.m.length+'</div>',iconSize:[36,36],iconAnchor:[18,18]}),keyboard:true,title:g.m.length+' sitios cerca: toca para separarlos'});
      gm.on('click',function(){fanKey=key;renderMap();});
      gm.addTo(pinLayer);return;
    }
    var n=g.m.length,R=Math.max(52,n*15);
    L.circleMarker(cl,{radius:4,weight:0,fillColor:'#2b3a35',fillOpacity:1,interactive:false}).addTo(pinLayer);
    g.m.forEach(function(s,i){
      var a=-Math.PI/2+i*2*Math.PI/n,pos=map.unproject({x:g.c.x+R*Math.cos(a),y:g.c.y+R*Math.sin(a)},z);
      L.polyline([cl,pos],{color:'#2b3a35',weight:2,opacity:.55,interactive:false}).addTo(pinLayer);
      addPin(s,pos);
    });
  });
}
function addPin(s,ll){
  var m=L.marker(ll,{icon:pinIcon(s.type,s.id===selectedId?'sel':''),zIndexOffset:s.id===selectedId?1000:0,keyboard:true,title:s.name+' ('+((TMAP[s.type]||{}).label||'')+')'});
  m.on('click',function(){select(s.id);});
  m.addTo(pinLayer);
}

function allPoints(list){
  var pts=[];list.forEach(function(s){pts.push([s.lat,s.lon]);if(s.track&&s.track.pts)s.track.pts.forEach(function(p){pts.push([p[0],p[1]]);});});
  return pts;
}
function fitAll(){

  if(pts.length===1){map.setView(pts[0],12);return;}
  map.fitBounds(L.latLngBounds(pts),{padding:[70,70],maxZoom:13});
}

function profileSvg(tr){

  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','profile');svg.setAttribute('role','img');

function seriesFor(tr,kind){
  var pts=tr.pts,out=[],i;

    return out.length>=3?out:null;
  }
  var tp=pts.filter(function(p){return p[4]!==null&&p[4]!==undefined;});
  if(tp.length<5||!(tr.dur>0))return null;
  for(i=0;i<tp.length;i++){
    var lo=i,hi=i;
    while(tp[hi][4]-tp[lo][4]<25&&(lo>0||hi<tp.length-1)){if(lo>0)lo--;if(tp[hi][4]-tp[lo][4]>=25)break;if(hi<tp.length-1)hi++;}
    var dt=tp[hi][4]-tp[lo][4];
    if(dt>0)out.push({d:tp[i][3],v:Math.min(120,(tp[hi][3]-tp[lo][3])/dt*3.6),ll:[tp[i][0],tp[i][1]]});

function trackChart(tr,kind){

  wrap.append(h('div',{class:'chart-head'},h('span',{text:isE?'Desnivel':'Velocidad'}),ro));
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+(H+14));svg.setAttribute('role','img');
  svg.setAttribute('aria-label',(isE?'Gráfica de desnivel: de '+nf0.format(lo)+' a '+nf0.format(hi)+' m':'Gráfica de velocidad: media '+nf1.format(avg)+' km/h, máxima '+nf1.format(hi)+' km/h'));
  svg.innerHTML='<path d="'+path+'L'+W+' '+H+'L0 '+H+'Z" fill="currentColor" fill-opacity=".16"/><path d="'+path+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
   +'<text x="2" y="10" font-size="9" style="fill:var(--muted)">'+fmtV(hi)+'</text><text x="2" y="'+(H-3)+'" font-size="9" style="fill:var(--muted)">'+fmtV(lo)+'</text>'
   +'<text x="0" y="'+(H+11)+'" font-size="9" style="fill:var(--muted)">0 km</text><text x="'+W+'" y="'+(H+11)+'" text-anchor="end" font-size="9" style="fill:var(--muted)">'+nf1.format(dmax/1000)+' km</text>'
   +'<line id="cur" x1="0" y1="0" x2="0" y2="'+H+'" stroke="currentColor" stroke-width="1" visibility="hidden"/><circle r="3.5" fill="currentColor" visibility="hidden"/>';
  var cur=svg.querySelector('line'),dot=svg.querySelector('circle'),base=ro.textContent;

    var d=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*dmax,a=0,b=data.length-1;
    while(b-a>1){var m=(a+b)>>1;if(data[m].d<d)a=m;else b=m;}
    var p=Math.abs(data[a].d-d)<=Math.abs(data[b].d-d)?data[a]:data[b],x=X(p.d);
    cur.setAttribute('x1',x);cur.setAttribute('x2',x);cur.setAttribute('visibility','visible');
    dot.setAttribute('cx',x);dot.setAttribute('cy',Y(p.v));dot.setAttribute('visibility','visible');
    ro.textContent=nf1.format(p.d/1000)+' km · '+fmtV(p.v);
    scrubLayer.clearLayers();

  }
  function off(){cur.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');ro.textContent=base;scrubLayer.clearLayers();}
  svg.addEventListener('pointermove',at);svg.addEventListener('pointerdown',at);
  svg.addEventListener('pointerleave',off);svg.addEventListener('pointercancel',off);
  wrap.append(svg);
  return wrap;
}

function computeStats(){
  var mine=sites.filter(function(s){return !s.example&&isMine(s);});
  var st={sites:mine.length,tracks:0,km:0,gain:0,dur:0,maxE:null,longest:null,mostGain:null,highest:null,byType:{},months:{},thisYear:0};
  var yr=String(new Date().getFullYear());
  mine.forEach(function(s){
    st.byType[s.type]=(st.byType[s.type]||0)+1;
    if(s.date&&s.date.slice(0,4)===yr)st.thisYear++;
    var tr=s.track;if(!tr||!(tr.dist>0))return;
    st.tracks++;st.km+=tr.dist/1000;st.gain+=tr.gain||0;st.dur+=tr.dur||0;
    if(!st.longest||tr.dist>st.longest.v)st.longest={v:tr.dist,name:s.name};
    if(!st.mostGain||(tr.gain||0)>st.mostGain.v)st.mostGain={v:tr.gain||0,name:s.name};
    if(tr.maxE!==null&&tr.maxE!==undefined&&(!st.highest||tr.maxE>st.highest.v)){st.highest={v:tr.maxE,name:s.name};st.maxE=tr.maxE;}
    if(s.date){var k=s.date.slice(0,7);st.months[k]=(st.months[k]||0)+tr.dist/1000;}
  });
  return st;
}
function fmtKmN(k){return (k<100?nf1:nf0).format(k);}
function monthsChart(st){
  var now=new Date(),keys=[],i,L12=['E','F','M','A','M','J','J','A','S','O','N','D'];
  for(i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:L12[d.getMonth()]});}
  var vals=keys.map(function(x){return st.months[x.k]||0;}),mx=Math.max.apply(null,vals.concat([1]));
  var W=300,H=90,bw=16,gap=(W-12*bw)/11;
  var svg='<svg viewBox="0 0 '+W+' '+(H+16)+'" role="img" aria-label="Kilómetros por mes en los últimos 12 meses" style="color:var(--accent)">';
  keys.forEach(function(x,j){
    var bh=vals[j]>0?Math.max(3,(vals[j]/mx)*H):1.5,xx=j*(bw+gap);
    svg+='<rect x="'+xx.toFixed(1)+'" y="'+(H-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="3" fill="currentColor" fill-opacity="'+(vals[j]>0?1:.25)+'"/>';
    svg+='<text x="'+(xx+bw/2).toFixed(1)+'" y="'+(H+12)+'" text-anchor="middle" font-size="9" style="fill:var(--muted)">'+x.l+'</text>';
  });
  return {svg:svg+'</svg>',max:mx};
}

function isDenied(e){
  var m=String((e&&e.message)||'');
  return !!(e&&(e.code==='42501'||e.statusCode==='403'||e.statusCode===403))||/row-level security|not authorized|permission denied|violates row/i.test(m);
}
function openShare(){
  if(!sb||!session)return;
  var box=$('#authBox');
  var outBox=h('div',{class:'share-list'}),inBox=h('div',{class:'share-list'});
  var err=h('div',{class:'err',role:'alert'});
  var em=h('input',{class:'input',id:'s-mail',type:'email',autocomplete:'off',inputmode:'email',autocapitalize:'none',autocorrect:'off',placeholder:'correo de la otra persona','aria-label':'Correo de la otra persona'});
  var perm=h('select',{class:'input',id:'s-perm','aria-label':'Permiso'},h('option',{value:'0',text:'Solo puede ver'}),h('option',{value:'1',text:'Puede ver y editar'}));
  var add=h('button',{class:'btn primary',type:'submit',text:'Compartir'});
  function callShare(mail,edit){return sb.rpc('share_with',{p_email:mail,p_can_edit:edit}).then(function(r){if(r.error)throw r.error;});}
  function refresh(){
    return pullShares().then(function(c){persist();paint();if(c){render();scheduleSync(0);}}).catch(function(e){err.textContent=errText(e);});
  }
  function paint(){
    outBox.replaceChildren();
    if(!shareOut.length)outBox.append(h('p',{class:'hint',style:'margin:0',text:'Todavía no compartes tus sitios con nadie.'}));
    shareOut.forEach(function(x){
      var sel=h('select',{class:'input','aria-label':'Permiso de '+x.shared_email,style:'width:auto;flex:none;padding:6px 8px;font-size:14px'},
        h('option',{value:'0',text:'Ver'}),h('option',{value:'1',text:'Editar'}));
      sel.value=x.can_edit?'1':'0';
      sel.addEventListener('change',function(){
        err.textContent='';
        callShare(x.shared_email,sel.value==='1').then(refresh).catch(function(e){err.textContent=errText(e);});
      });
      outBox.append(h('div',{class:'share-row'},h('span',{class:'nm',text:x.shared_email}),sel,
        h('button',{class:'btn sm danger',type:'button',text:'Quitar',onclick:function(){
          err.textContent='';
          sb.from('shares').delete().eq('owner_id',session.user.id).eq('shared_with',x.shared_with).then(function(r){if(r.error){err.textContent=errText(r.error);return;}refresh();});
        }})));
    });
    inBox.replaceChildren();
    if(!shareIn.length)inBox.append(h('p',{class:'hint',style:'margin:0',text:'Nadie ha compartido sus sitios contigo.'}));
    shareIn.forEach(function(x){
      inBox.append(h('div',{class:'share-row'},h('span',{class:'nm',text:x.owner_email}),h('span',{class:'hint',text:x.can_edit?'puedes editar':'solo ver'}),
        h('button',{class:'btn sm',type:'button',text:'Dejar de ver',onclick:function(){
          err.textContent='';
          sb.from('shares').delete().eq('owner_id',x.owner_id).eq('shared_with',session.user.id).then(function(r){if(r.error){err.textContent=errText(r.error);return;}refresh();});
        }})));
    });
  }
  var form=h('form',{novalidate:true},
    h('span',{class:'lbl',style:'font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)',text:'Compartir con alguien'}),
    em,perm,add,
    h('span',{class:'hint',text:'La otra persona tiene que haber creado antes su cuenta en la app con ese correo.'}));
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var mail=em.value.trim();
    if(!/^\S+@\S+\.\S+$/.test(mail)){err.textContent='Escribe un correo válido.';return;}
    add.disabled=true;err.textContent='';
    callShare(mail,perm.value==='1').then(function(){add.disabled=false;em.value='';toast('Compartido con '+mail+'.');return refresh();}).catch(function(e){add.disabled=false;err.textContent=errText(e);});
  });
  box.replaceChildren(h('div',{class:'card'},
    h('h2',{class:'card-title',text:'Compartir'}),
    h('p',{class:'hint',style:'margin:0',text:'La otra persona verá todos tus sitios, también los que añadas más adelante. Para ver los suyos, ella tiene que compartir los suyos contigo.'}),
    h('div',{class:'field'},h('span',{class:'lbl',text:'Tienen acceso a tus sitios'}),outBox),
    form,
    h('div',{class:'field'},h('span',{class:'lbl',text:'Comparten contigo'}),inBox),
    err,
    h('button',{class:'btn',type:'button',text:'Cerrar',onclick:function(){box.hidden=true;}})));

  else refresh();

function openAuth(){
  var box=$('#authBox'),mode='in';
  var title=h('h2',{class:'card-title'});
  var em=h('input',{class:'input',id:'a-mail',type:'email',autocomplete:'email',inputmode:'email',autocapitalize:'none',autocorrect:'off',placeholder:'correo@ejemplo.com','aria-label':'Correo'});
  var pw=h('input',{class:'input',id:'a-pass',type:'password',placeholder:'Contraseña (mínimo 8 caracteres)','aria-label':'Contraseña'});
  var err=h('div',{class:'err',role:'alert'});
  var go=h('button',{class:'btn primary',type:'submit'});
  var sw=h('button',{class:'btn sm',type:'button'});
  var cancel=h('button',{class:'btn sm',type:'button',text:'Cancelar',onclick:function(){box.hidden=true;}});
  function label(){
    title.textContent=mode==='in'?'Iniciar sesión':'Crear cuenta';
    go.textContent=mode==='in'?'Entrar':'Crear cuenta';
    sw.textContent=mode==='in'?'No tengo cuenta':'Ya tengo cuenta';
    pw.setAttribute('autocomplete',mode==='in'?'current-password':'new-password');
  }
  sw.addEventListener('click',function(){mode=mode==='in'?'up':'in';err.textContent='';label();});
  var form=h('form',{novalidate:true},title,em,pw,err,go,h('div',{class:'row'},sw,cancel),
    h('button',{class:'linkbtn',type:'button',text:'¿Olvidaste tu contraseña?',onclick:function(){box.hidden=true;openReset(em.value.trim());}}));
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var mail=em.value.trim(),pass=pw.value;
    if(!/^\S+@\S+\.\S+$/.test(mail)){err.textContent='Escribe un correo válido.';return;}
    if(pass.length<8){err.textContent='La contraseña necesita al menos 8 caracteres.';return;}
    go.disabled=true;err.textContent='';
    var p=mode==='in'?sb.auth.signInWithPassword({email:mail,password:pass}):sb.auth.signUp({email:mail,password:pass});
    p.then(function(r){
      go.disabled=false;
      if(r.error){err.textContent=errText(r.error);return;}
      if(mode==='up'&&!(r.data&&r.data.session)){err.textContent='Cuenta creada. Confirma el correo que te hemos enviado y luego inicia sesión.';mode='in';label();return;}
      box.hidden=true;toast('Sesión iniciada.');
    }).catch(function(e){go.disabled=false;err.textContent=errText(e);});
  });
  label();
  box.replaceChildren(h('div',{class:'card'},form));
  box.hidden=false;
  setTimeout(function(){em.focus();},50);
}
function confirmSignOut(){
  var box=$('#authBox');
  var msg=h('p',{class:'hint',style:'margin:0',text:'Comprobando cambios pendientes…'});
  var out=h('button',{class:'btn danger',type:'button',text:'Cerrar sesión',onclick:function(){
    out.disabled=true;
    sb.auth.signOut().then(function(){box.hidden=true;wipeLocal();toast('Sesión cerrada.');}).catch(function(e){out.disabled=false;msg.textContent=errText(e);});
  }});
  box.replaceChildren(h('div',{class:'card'},h('h2',{class:'card-title',text:'Cerrar sesión'}),msg,out,
    h('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){box.hidden=true;}})));
  box.hidden=false;
  syncNow().then(function(){
    var n=pendingCount();
    msg.textContent=n?('Quedan '+n+(n===1?' cambio':' cambios')+' sin subir. Si sales ahora se perderán en este dispositivo.'):'Tus sitios siguen en tu cuenta. Solo se borrarán de este dispositivo.';

}
function initSync(){
  var c=window.SML_CONFIG||{};
  if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){syncState='nocfg';hideGate();renderAcct();return;}
  if(!window.supabase){syncState='nolib';hideGate();renderAcct();return;}
  sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  syncState='idle';
  setTimeout(gateResolve,6000);
  sb.auth.onAuthStateChange(function(ev,s){
    var was=session;session=s;if(s)meId=s.user.id;
    setTimeout(function(){
      if(s&&(!was||was.user.id!==s.user.id)){startRealtime();scheduleSync(0);}
      if(!s)stopRealtime();
      if(s){guest=false;skipGate=false;setUI({guest:false});applyProfile(s.user);}
      if(ev==='SIGNED_OUT'){guest=false;recovering=false;setUI({guest:false});}
      if(ev==='PASSWORD_RECOVERY'){recovering=true;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}openRecovery();}
      gateResolve();renderHeader();
      renderAcct();
    },0);
  });
  sb.auth.getSession().then(function(r){
    if(!session&&r.data&&r.data.session){session=r.data.session;meId=session.user.id;applyProfile(session.user);startRealtime();syncNow();}
    gateResolve();renderHeader();
    renderAcct();
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden)syncNow();});
  window.addEventListener('online',function(){syncNow();});
  window.addEventListener('offline',function(){syncState='offline';renderAcct();});
}
